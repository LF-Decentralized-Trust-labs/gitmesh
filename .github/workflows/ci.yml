
name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 33

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check forbidden tokens
        run: pnpm check:tokens

      - name: Lint import boundaries
        run: pnpm lint

      - name: Type check
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm test:run

      # T1.18: its own step so the 2s wall-clock assertion is measured on a
      # quiet runner, not next to the parallel vitest workers above.
      - name: Doctor performance guard
        run: pnpm test:perf

      - name: Build
        run: pnpm build

      - name: gitmesh-cli clean-install smoke test
        run: ./scripts/smoke-gitmesh-cli.sh
